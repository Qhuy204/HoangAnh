<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gửi HoangAnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07060b; --cream:#f3ead9; --dim:#9a93a3; --accent:#ff4d6d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:radial-gradient(120% 90% at 50% 40%, #1a0f1f 0%, var(--bg) 65%); color:var(--cream); font-family:"Be Vietnam Pro", system-ui, sans-serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

  .scene { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding:24px; text-align:center;
    opacity:0; visibility:hidden; transition:opacity 1.6s ease, visibility 0s 1.6s; z-index:3; pointer-events:none; }
  .scene.active { opacity:1; visibility:visible; transition:opacity 1.6s ease .5s; pointer-events:auto; }
  .small { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); }
  .serif { font-family:"Quicksand", "Be Vietnam Pro", sans-serif; font-weight:700; letter-spacing:-.01em; }

  /* Cảnh 1 */
  #s1 { justify-content:center; }
  #s1 .small { display:inline-block; color:var(--cream); animation:ring 1.6s ease-in-out infinite; }
  @keyframes ring { 0%, 50%, 100% { transform:none; } 5%, 15%, 25%, 35% { transform:rotate(-5deg) translateX(-2px); } 10%, 20%, 30%, 40% { transform:rotate(5deg) translateX(2px); } }
  .line { margin:0 0 30px; font-size:clamp(16px, 4vw, 20px); letter-spacing:.04em; text-shadow:0 0 10px var(--bg), 0 0 18px var(--bg), 0 0 26px var(--bg); }
  #s1 h1 { margin:14px 0 10px;font-size:clamp(40px, 10vw, 84px); line-height:1.05; text-shadow:0 0 40px rgba(255,77,109,.45); }
  .start { background:none; border:1px solid rgba(243,234,217,.5); border-radius:999px; padding:13px 30px; letter-spacing:.14em; text-transform:uppercase; font-size:13px;
    transition:background .3s, color .3s, box-shadow .3s; animation:glow 2.4s ease-in-out infinite; }
  .start:hover { background:var(--cream); color:var(--bg); }
  @keyframes glow { 50% { box-shadow:0 0 28px rgba(255,77,109,.55); } }

  /* Cảnh tin nhắn đầu tiên + bộ đếm */
  #sm { justify-content:center; gap:22px; cursor:pointer; }
  #sm img { width:min(86vw, 420px, 53vh); height:auto; border-radius:22px;
    box-shadow:0 0 0 1px rgba(243,234,217,.2), 0 20px 60px rgba(0,0,0,.6), 0 0 50px rgba(255,77,109,.28); }
  .count { display:flex; gap:clamp(12px, 4vw, 26px); }
  .count div { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .count b { font-family:"Quicksand", sans-serif; font-weight:700; font-size:clamp(30px, 8.5vw, 52px); line-height:1; font-variant-numeric:tabular-nums;
    text-shadow:0 0 30px rgba(255,77,109,.55); }
  .count span { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  #sm .hint { opacity:.55; animation:hint 2.4s ease-in-out infinite; }
  @keyframes hint { 50% { opacity:.2; } }

  /* Cảnh 2: phụ đề dưới đám hạt */
  #s2 { justify-content:flex-end; padding-bottom:11vh; cursor:pointer; }
  .sub.big { font-family:"Quicksand", sans-serif; font-weight:700; font-size:clamp(30px, 8vw, 56px); line-height:1.2; }
  .sub { min-height:3.2em; max-width:560px; margin:0; font-size:clamp(17px, 4.2vw, 22px); line-height:1.55; }
  .w { display:inline-block; opacity:0; filter:blur(6px); transform:translateY(8px); animation:word 1.1s ease forwards; animation-delay:calc(.9s + var(--i) * 200ms); }
  @keyframes word { to { opacity:1; filter:none; transform:none; } }

  /* Cảnh 3: câu hỏi, đặt dưới trái tim */
  #s3 { justify-content:flex-end; padding-bottom:8vh; }
  #s3 h1 { margin:0 0 6px; font-size:clamp(30px, 7.6vw, 60px); line-height:1.1; text-shadow:0 2px 30px rgba(7,6,11,.9); text-wrap:balance; }
  .c { display:inline-block; opacity:0; transform:translateY(.5em) rotate(6deg) scale(.6); }
  .active .c { animation:pop .9s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay:calc(1.2s + var(--i) * 110ms); }
  @keyframes pop { to { opacity:1; transform:none; } }
  .answers { display:flex; gap:14px; align-items:center; justify-content:center; min-height:76px; margin-top:10px; }
  .btn { font-weight:500; border:0; border-radius:999px; padding:13px 34px; opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .6s, transform .6s, background .2s, scale .4s cubic-bezier(.34,1.8,.64,1); }
  .btn.show { opacity:1; transform:none; pointer-events:auto; }
  #yes { background:var(--accent); color:#fff; scale:var(--g, 1); box-shadow:0 8px 34px rgba(255,77,109,.55); }
  #yes:hover { background:#ff6f8a; }
  #no { background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(243,234,217,.6); }
  #no.run { position:fixed; z-index:7; background:#17131c; transition:left .28s cubic-bezier(.34,1.4,.64,1), top .28s cubic-bezier(.34,1.4,.64,1), rotate .28s; }

  body:not(.ready) #start { visibility:hidden; }

  /* núi meme sau khi bấm Yes */
  #memes { position:fixed; inset:0; z-index:4; overflow:hidden; pointer-events:none; }
  #memes img { translate:calc(var(--lx, 0) * -14px) calc(var(--ly, 0) * -14px); }   /* nghiêng máy: tường lệch ngược, ảnh và chữ lệch xuôi */
  #memes img { position:absolute; object-fit:cover; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.5); will-change:transform, opacity;
    opacity:0; transform:translate(var(--dx, 0), var(--dy, 0)) scale(.06) rotate(var(--r0)); filter:brightness(1.8);
    transition:transform 1.5s cubic-bezier(.16,.9,.3,1.06), opacity .5s ease, filter 1.5s ease; }
  #memes img.hero { left:50%; top:50%; width:min(72vw, 48vh, 380px); aspect-ratio:2/3; margin:0; translate:calc(-50% + var(--lx, 0) * 26px) calc(-50% + var(--ly, 0) * 26px); z-index:2; border-radius:28px;
    box-shadow:0 0 0 4px rgba(255,255,255,.9), 0 24px 70px rgba(0,0,0,.7), 0 0 60px rgba(255,77,109,.45);
    transition:transform 2.6s cubic-bezier(.16,.84,.3,1), opacity 1.8s ease, filter 2.6s ease; }
  #memes img.hero.up { transform:translate(0, 0) scale(1) rotate(-2deg); }
  #memes .cap { position:absolute; left:50%; top:calc(50% + min(72vw, 48vh, 380px) * .75 + 10px); translate:calc(-50% + var(--lx, 0) * 38px) calc(var(--ly, 0) * 38px); z-index:3; white-space:nowrap;
    font-family:"Quicksand", "Be Vietnam Pro", sans-serif; font-weight:700; font-size:clamp(28px, 8vw, 46px); color:#fff; padding:2px 22px 6px; border-radius:999px;
    background:var(--accent); box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 12px 34px rgba(0,0,0,.55);
    opacity:0; transform:translateY(24px) scale(.6) rotate(-3deg); transition:transform .9s cubic-bezier(.3,1.6,.5,1), opacity .6s ease; }
  #memes .cap.up { opacity:1; transform:rotate(-3deg); }
  #memes .cap { pointer-events:auto; cursor:pointer; touch-action:manipulation; }
  .flyer { position:fixed; left:0; top:0; z-index:6; pointer-events:none; filter:drop-shadow(0 6px 14px rgba(0,0,0,.45)); will-change:transform; }
  .flyer svg { display:block; width:100%; height:100%; }
  #memes img.up { opacity:1; transform:translate(0, 0) scale(1.1) rotate(var(--r)); filter:none; }

  /* chữ nhắc hiện ra khi chạm vào phong ấn */
  #sealHint { position:fixed; left:0; top:0; z-index:5; pointer-events:none; white-space:nowrap; font:600 12px/1 "Quicksand", sans-serif; letter-spacing:.14em;
    color:#ffd0dc; text-shadow:0 0 10px rgba(255,77,109,.9); opacity:0; transition:opacity .4s; }
  #sealHint.show { opacity:1; }

  /* đĩa nhạc */
  .player { position:fixed; left:50%; bottom:14px; translate:-50% 0; z-index:5; display:flex; align-items:center; gap:14px; padding:6px 22px 6px 6px;
    background:rgba(255,255,255,.07); backdrop-filter:blur(10px); border-radius:999px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); max-width:calc(100vw - 24px); }
  .disc { position:relative; width:76px; height:76px; flex:none; padding:0; border:0; background:none; }
  .vinyl { position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:repeating-radial-gradient(circle, #101114 0 2px, #25272d 2px 3px); box-shadow:0 4px 14px rgba(0,0,0,.6), inset 0 0 0 1px #000;
    animation:spin 3.2s linear infinite; animation-play-state:paused; }
  .vinyl::before { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 20deg, transparent 0 40deg, rgba(255,255,255,.18) 60deg, transparent 80deg 220deg, rgba(255,255,255,.13) 240deg, transparent 260deg); }
  .vinyl::after { content:""; position:absolute; width:7px; height:7px; border-radius:50%; background:var(--cream); box-shadow:0 0 0 1px rgba(0,0,0,.5); }
  .vinyl img { width:44%; height:44%; border-radius:50%; object-fit:cover; background:var(--accent); }
  .playing .vinyl { animation-play-state:running; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .arm { position:absolute; right:-4px; top:-4px; width:5px; height:44px; border-radius:3px; background:linear-gradient(#e6dfd0, #9a927f); transform-origin:50% 5px; transform:rotate(-12deg);
    transition:transform .7s cubic-bezier(.34,1.3,.64,1); box-shadow:0 2px 4px rgba(0,0,0,.5); }
  .arm::before { content:""; position:absolute; left:-4px; top:-2px; width:13px; height:13px; border-radius:50%; background:#8d8573; }
  .arm::after { content:""; position:absolute; left:-2px; bottom:-3px; width:9px; height:12px; border-radius:2px; background:var(--accent); }
  .playing .arm { transform:rotate(24deg); }
  .track { display:flex; flex-direction:column; min-width:0; text-align:left; font-size:13px; line-height:1.35; }
  .track b { font-weight:500; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track span { color:var(--dim); }
  /* đĩa nhạc thu nhỏ, nằm ở góc trên phải */
  .player { left:auto; bottom:auto; right:14px; top:14px; translate:none; flex-direction:row-reverse; gap:10px; padding:0; background:none; backdrop-filter:none; box-shadow:none; }
  .disc { width:44px; height:44px; }
  .vinyl::after { width:4px; height:4px; }
  .arm { right:-3px; top:-3px; width:3px; height:26px; transform-origin:50% 3px; }
  .arm::before { left:-3px; top:-2px; width:9px; height:9px; }
  .arm::after { left:-1.5px; bottom:-2px; width:6px; height:8px; }
  .track { text-align:right; font-size:11px; opacity:.75; transition:opacity .6s; }
  .track b { font-size:11px; font-weight:400; letter-spacing:.04em; }
  .playing .track span { display:none; }
  .playing .track { opacity:.45; }
  .embed { position:fixed; left:0; bottom:0; width:300px; height:80px; opacity:0; pointer-events:none; z-index:-1; }
</style>

<body>
<canvas id="gl"></canvas>

<section class="scene active" id="s1">
  <span class="small" id="kicker"></span>
  <h1 class="serif" id="title"></h1>
  <p class="line" id="line"></p>
  <button class="start" id="start"></button>
</section>

<section class="scene" id="sm">
  <span class="small" id="mlabel"></span>
  <img id="mimg" alt="">
  <div class="count" id="count"></div>
  <span class="small hint">chạm để tiếp tục</span>
</section>

<section class="scene" id="s2"><p class="sub" id="sub"></p></section>

<section class="scene" id="s3">
  <h1 class="serif" id="headline"></h1>
  <div class="answers" id="answers">
    <button class="btn" id="yes"></button>
    <button class="btn" id="no"></button>
  </div>
</section>

<span id="sealHint"></span>
<div id="memes"></div>

<div class="player">
  <button class="disc" id="disc" aria-label="Bật / tắt nhạc">
    <span class="vinyl"><img id="cover" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></span>
    <span class="arm"></span>
  </button>
  <div class="track"><b id="trackName"></b><span id="trackState">chạm đĩa để bật nhạc</span></div>
</div>
<div class="embed"><div id="spotify"></div></div>

<script>
/* ============ SỬA NỘI DUNG Ở ĐÂY ============ */
const CONFIG = {
  kicker: "Ring ring ring",
  title: "HoangAnh yêu,",
  line: "you have a message from Qhuy",
  startLabel: "Mở tin nhắn",
  // mỗi bước: hạt xếp thành "shape" ("cloud", "moon" hoặc "heart"), bên dưới hiện câu "text"; big: true là chữ to
  steps: [
    { shape: "cloud", text: "Dear phù thủy ma cà rồng xink iu siu ngầu" },
    { shape: "heart", text: "Em thích chị.", big: true }
  ],
  headline: "Will you be my girlfriend?",
  yes: { label: "Yes" },
  memes: 33,   // số ảnh trong assets/memes (m01.jpg ... m33.jpg), bấm Yes là nổi lên phủ kín màn hình
  // nút No không bấm được: mỗi lần chạm là nhảy chỗ khác và đổi chữ
  no: ["No", "Hụt rồi", "Bấm lại xem", "Chắc chưa?", "Nghĩ kỹ đi", "Nút kia kìa", "Vẫn cố à?", "Thôi mà"],
  spotifyTrackId: "3Ids3RXurYBgySph53qWnB", // Từng Ngày Yêu Em - buitruonglinh
  trackName: "Từng Ngày Yêu Em",
  // muốn chắc chắn phát cả bài từ giây đầu: bỏ file nhạc vào assets rồi điền tên, vd "assets/song.mp3" (khi đó không dùng Spotify nữa)
  audioFile: "",
  firstMessage: "2026-07-30T21:54:00+07:00",   // thời điểm tin nhắn đầu tiên (năm-tháng-ngày, giờ VN), bộ đếm tính từ đây; để "" là bỏ màn này
  firstMessagePhoto: "assets/firstmsg.webp",
  firstMessageLabel: "First message",
  caption: "iu thíiiii",   // chữ dưới ảnh
  secretHints: ["bấm yes mới mở", "hong cho xem", "yes đi rồi biết"],   // chạm vào phong ấn trước khi bấm Yes
  photo: "assets/hoanganh2.webp"   // ảnh nổi lên trên tường meme ở cuối, bo góc; để "" nếu không dùng
};
/* ============================================ */

const $ = id => document.getElementById(id);
["kicker", "title", "line", "trackName"].forEach(k => $(k).textContent = CONFIG[k]);
$("start").textContent = CONFIG.startLabel;
$("yes").textContent = CONFIG.yes.label;
$("no").textContent = CONFIG.no[0];

/* ---------- Đĩa nhạc: điều khiển trình phát Spotify ẩn ---------- */
let controller = null, playing = false;
const setPlaying = on => {
  playing = on;
  document.querySelector(".player").classList.toggle("playing", on);
  $("trackState").textContent = on ? "đang phát" : "chạm đĩa để bật nhạc";
};
if (CONFIG.audioFile) {            // có file nhạc riêng: phát thẳng file, luôn từ đầu bài
  const au = new Audio(CONFIG.audioFile); au.loop = true;
  ["play", "pause"].forEach(ev => au.addEventListener(ev, () => setPlaying(!au.paused)));
  controller = { play: () => au.play().catch(() => {}), togglePlay: () => au.paused ? au.play().catch(() => {}) : au.pause() };
  controller.play();
}
let rewound = false;
window.onSpotifyIframeApiReady = api => {
  if (CONFIG.audioFile) return;
  api.createController($("spotify"), { uri: "spotify:track:" + CONFIG.spotifyTrackId, width: 300, height: 80 }, c => {
    controller = c;
    c.play();   // thử tự bật ngay khi tải xong (trình duyệt có thể chặn tới lần chạm đầu tiên)
    c.addListener("playback_update", e => {
      const d = e.data;
      if (!rewound && !d.isPaused) { rewound = true; if (d.position > 1500) c.seek(0); }   // lần phát đầu: tua về đầu bài
      // người chưa đăng nhập Spotify chỉ nghe được đoạn ngắn: hết đoạn thì phát lại từ đầu
      if (d.isPaused && d.duration && d.position >= d.duration - 400) { c.seek(0); c.play(); return; }
      setPlaying(!d.isPaused && !d.isBuffering);
    });
  });
};
$("disc").addEventListener("click", () => { if (controller) controller.togglePlay(); });
// trình duyệt chặn tự phát khi chưa có thao tác: chạm lần đầu ở bất kỳ đâu là nhạc lên
const firstTouch = e => {
  if (e.target.closest("#disc")) return;
  if (controller && !playing) controller.play();
  if (controller) ["pointerdown", "keydown"].forEach(ev => removeEventListener(ev, firstTouch, true));
};
["pointerdown", "keydown"].forEach(ev => addEventListener(ev, firstTouch, true));
fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent("https://open.spotify.com/track/" + CONFIG.spotifyTrackId))
  .then(r => r.json()).then(d => { if (d.thumbnail_url) $("cover").src = d.thumbnail_url; }).catch(() => {});
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>

<script type="module">
import * as THREE from "three";

const COUNT = innerWidth < 700 ? 16000 : 26000;
const gauss = () => (Math.random() + Math.random() + Math.random() + Math.random() - 2) * .87;   // xấp xỉ phân bố chuẩn
const CAM_Z = 60, FOV = 50;
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene3 = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 400);
camera.position.z = CAM_Z;

/* ---------- Các hình mà đám hạt xếp thành ---------- */
const view = () => { const h = 2 * CAM_Z * Math.tan(FOV * Math.PI / 360); return { w: h * camera.aspect, h }; };
const rnd = (a = 1) => (Math.random() - .5) * 2 * a;

function cloud() {            // đám bụi sao lúc mở đầu
  const a = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const r = 12 + Math.cbrt(Math.random()) * 38, t = Math.random() * 6.283, p = Math.acos(rnd());
    a.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p) * .7, r * Math.sin(p) * Math.sin(t)], i * 3);
  }
  return a;
}
function moon() {             // trăng khuyết, quanh có bụi sáng
  const a = new Float32Array(COUNT * 3), v = view(), R = Math.min(v.w * .3, v.h * .2);
  for (let i = 0; i < COUNT; i++) {
    let x, y;
    if (Math.random() < .12) { x = gauss() * R * 1.3; y = gauss() * R * 1.3; }
    else do { x = rnd(R); y = rnd(R); } while (Math.hypot(x, y) > R || Math.hypot(x - R * .42, y - R * .12) < R * .88);
    a.set([x - R * .15, y + v.h * .08, gauss() * R * .07], i * 3);
  }
  return a;
}
function heart() {            // tinh vân hình tim: viền mờ như khói sao, lòng tim rải bụi, ngoài rìa có quầng bụi loãng
  const a = new Float32Array(COUNT * 3), v = view(), s = Math.min(v.w * .4, v.h * .26) / 17;
  // viền tim kiểu emoji ❤️: nửa phải vẽ bằng các đường cong Bézier (hệ 32x32, y hướng xuống), hông phình ra, đít bo tròn; nửa trái lật đối xứng
  const R = [[16, 7, 17.6, 3.4, 20.4, 2, 23.5, 2], [23.5, 2, 27.8, 2, 31, 5.2, 31, 10], [31, 10, 31, 17.5, 23.5, 23.6, 18.6, 28.2], [18.6, 28.2, 17.7, 29.1, 16.9, 29.6, 16, 29.6]];
  const bez = (c, t) => { const u = 1 - t; return [0, 1].map(j => u * u * u * c[j] + 3 * u * u * t * c[2 + j] + 3 * u * t * t * c[4 + j] + t * t * t * c[6 + j]); };
  const half = []; R.forEach(c => { for (let i = 0; i < 120; i++) half.push(bez(c, i / 120)); }); half.push([16, 29.6]);
  const P = [...half, ...half.slice(0, -1).reverse().map(([x, y]) => [32 - x, y])].map(([x, y]) => [(x - 16) * 1.07, -(y - 15.6) * 1.07]);
  const N = P.length - 1, cum = new Float32Array(N + 1);   // bảng chiều dài cung để hạt rải đều dọc viền
  for (let i = 1; i <= N; i++) cum[i] = cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);

  const base = $("headline").querySelectorAll(".c").length;
  [...word].forEach((ch, k) => { const c = document.createElement("span"); c.className = "c"; c.style.setProperty("--i", base + k); c.textContent = ch; wrap.append(c); });
  $("headline").append(wrap); if (n < arr.length - 1) $("headline").append(" ");
});

// Nút No: chạm vào là nhảy lung tung, nút Yes to dần, trái tim giật mình
let dodges = 0;
const dodge = e => {
  e.preventDefault();
  const no = $("no"), r = no.getBoundingClientRect();
  if (!no.classList.contains("run")) {           // lần đầu: ghim tại chỗ rồi mới nhảy
    no.style.left = r.left + "px"; no.style.top = r.top + "px";
    no.classList.add("run"); no.getBoundingClientRect();
  }
  dodges++;
  no.textContent = CONFIG.no[dodges % CONFIG.no.length];
  const w = no.offsetWidth, h = no.offsetHeight, pad = 16, maxX = innerWidth - w - pad, maxY = innerHeight - h - 120;
  let x, y, tries = 0;
  do { x = pad + Math.random() * (maxX - pad); y = pad + Math.random() * (maxY - pad); }
  while (Math.hypot(x - r.left, y - r.top) < 160 && ++tries < 20);   // nhảy đủ xa chỗ cũ
  no.style.left = x + "px"; no.style.top = y + "px";
  no.style.rotate = (Math.random() * 30 - 15) + "deg";
  $("yes").style.setProperty("--g", Math.min(1 + dodges * .12, 2.2));
  flinch = -.12;
};
["pointerenter", "pointerdown", "click", "focus"].forEach(ev => $("no").addEventListener(ev, dodge));

let peeks = 0, hintTimer = 0;
addEventListener("pointerdown", e => {              // chạm vào phong ấn trước khi bấm Yes: nó rung lên nhưng không mở
  if (!sealOn || sealBreak > 0 || e.target.closest("button, .player")) return;
  if (Math.hypot(e.clientX - secretXY[0], e.clientY - secretXY[1]) > 80) return;
  sealPoke = performance.now(); flinch = -.06;
  $("sealHint").textContent = CONFIG.secretHints[peeks++ % CONFIG.secretHints.length];
  $("sealHint").classList.add("show"); clearTimeout(hintTimer);
  hintTimer = setTimeout(() => $("sealHint").classList.remove("show"), 1800);
});
const memeSrc = i => "assets/memes/m" + String(i % CONFIG.memes + 1).padStart(2, "0") + ".jpg";
const FLYERS = {                 // mũi máy bay giấy chỉ về góc trên phải (-45 độ)
  plane: '<svg viewBox="0 0 64 64"><path d="M4 30 60 6 44 58 30 38Z" fill="#fff"/><path d="M30 38 60 6 24 34Z" fill="#ffd0dc"/><path d="M30 38 28 52 36 44Z" fill="#ff8fa8"/></svg>',
  heart: '<svg viewBox="0 0 64 64"><path d="M32 56C8 38 4 26 4 18 4 9 11 4 18 4c6 0 11 3 14 8 3-5 8-8 14-8 7 0 14 5 14 14 0 8-4 20-28 38Z" fill="#ff4d6d" stroke="#fff" stroke-width="3"/></svg>'
};
function fly() {                 // một máy bay giấy hoặc trái tim bay ngang màn hình, vào từ một cạnh ngẫu nhiên, ra ở cạnh khác
  const W = innerWidth, H = innerHeight, kind = Math.random() < .5 ? "plane" : "heart", size = 44 + Math.random() * 40;
  const edge = s => { const t = .1 + Math.random() * .8; return s === 0 ? [-size, t * H] : s === 1 ? [W + size, t * H] : s === 2 ? [t * W, -size] : [t * W, H + size]; };
  const s0 = Math.floor(Math.random() * 4), s1 = (s0 + 1 + Math.floor(Math.random() * 3)) % 4;
  const [ax, ay] = edge(s0), [bx, by] = edge(s1), ang = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
  const r0 = kind === "plane" ? ang + 45 : rnd(40), r1 = kind === "plane" ? ang + 45 : r0 + rnd(160);
  const el = document.createElement("div"); el.className = "flyer"; el.innerHTML = FLYERS[kind];
  el.style.width = el.style.height = size + "px";
  document.body.append(el);
  const at = (x, y, r) => "translate(" + (x - size / 2) + "px," + (y - size / 2) + "px) rotate(" + r + "deg)";
  el.animate([{ transform: at(ax, ay, r0) }, { transform: at(bx, by, r1) }], { duration: 2200 + Math.random() * 1600, easing: "cubic-bezier(.4,.1,.6,.9)" }).onfinish = () => el.remove();
}

function memeWall() {              // ảnh từ sâu trong nền nổi dần lên, phủ kín cả màn hình
  const W = innerWidth, H = innerHeight, cell = Math.max(96, Math.min(170, W / 4));
  const nx = Math.ceil(W / cell), ny = Math.ceil(H / cell), w = W / nx, h = H / ny, total = nx * ny;
  const cells = [...Array(total).keys()].sort(() => Math.random() - .5), pics = [...Array(CONFIG.memes).keys()].sort(() => Math.random() - .5);
  let n = 0;
  const timer = setInterval(() => {
    if (n >= total) {
      clearInterval(timer);
      if (CONFIG.photo) setTimeout(() => {           // tường meme kín rồi thì ảnh chị nổi lên chính giữa
        const hero = new Image(); hero.className = "hero"; hero.alt = "";
        hero.style.setProperty("--r0", "-30deg");
        hero.style.setProperty("--dx", secretXY[0] - innerWidth / 2 + "px"); hero.style.setProperty("--dy", secretXY[1] - innerHeight / 2 + "px");
        hero.onload = () => { $("memes").append(hero); hero.getBoundingClientRect(); hero.classList.add("up");
          if (CONFIG.caption) setTimeout(() => {
            const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = CONFIG.caption;
            cap.addEventListener("click", () => {   // mỗi lần bấm bay ra 1-2 cái
              cap.animate([{ scale: 1 }, { scale: 1.18 }, { scale: 1 }], { duration: 260 });
              fly(); if (Math.random() < .5) setTimeout(fly, 180);
            });
            $("memes").append(cap); cap.getBoundingClientRect(); cap.classList.add("up");
          }, 2200);
        };
        hero.src = CONFIG.photo;
      }, 900);
      return;
    }
    const c = cells[n], img = new Image();
    img.src = memeSrc(pics[n % pics.length]); img.alt = "";
    Object.assign(img.style, { width: w + "px", height: h + "px", left: (c % nx) * w + "px", top: Math.floor(c / nx) * h + "px" });
    img.style.setProperty("--r0", rnd(200) + "deg"); img.style.setProperty("--r", rnd(5) + "deg");
    img.style.setProperty("--dx", secretXY[0] - ((c % nx) + .5) * w + "px"); img.style.setProperty("--dy", secretXY[1] - (Math.floor(c / nx) + .5) * h + "px");
    $("memes").append(img);
    img.getBoundingClientRect();
    img.classList.add("up");
    n++;
  }, Math.max(28, 2600 / total));
}

$("yes").addEventListener("click", () => {
  $("no").style.display = "none";
  show("");                                       // ẩn câu hỏi, nhường chỗ cho núi meme
  sealBreak = performance.now(); $("sealHint").classList.remove("show");   // phong ấn quay nhanh dần, trắng loá rồi vỡ
  setTimeout(() => { burstStart = performance.now(); flinch = .25; memeWall(); }, 650);   // trái tim nổ tung, meme phụt ra từ giữa
  setTimeout(() => sealOn = false, 1500);
});
</script>
</body>
