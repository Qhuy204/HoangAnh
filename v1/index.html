<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark only">
<meta name="theme-color" content="#07060b">
<title>Dear HoangAnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --glow:0 0 14px rgba(255,77,140,.55), 0 0 32px rgba(255,77,140,.25); --bg:#07060b; --cream:#f3ead9; --dim:#9a93a3; --accent:#ff4d6d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  /* trang vốn tối sẵn: báo cho trình duyệt (Safari, Chrome, Zalo/Messenger...) đừng tự bật "chế độ tối" đảo màu trang */
  :root { color-scheme:only dark; background:#07060b; }
  /* iPhone: chạm nhanh 2 lần để sang trang thì Safari tưởng là double-tap phóng to → cả trang bị zoom, trôi lệch sang một bên.
     Khoá trang đứng yên: không zoom bằng double-tap, không cuộn/kéo nảy ngang dọc */
  html, body { position:fixed; inset:0; width:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; -webkit-text-size-adjust:100%; }
  body { background:radial-gradient(120% 90% at 50% 40%, #1a0f1f 0%, var(--bg) 65%); color:var(--cream); font-family:"Be Vietnam Pro", system-ui, sans-serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

  .scene { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding:24px; text-align:center;
    opacity:0; visibility:hidden; transition:opacity 1.6s ease, visibility 0s 1.6s; z-index:3; pointer-events:none; }
  .scene.active { opacity:1; visibility:visible; transition:opacity 1.6s ease .5s; pointer-events:auto; }
  .small { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); }
  .serif { font-family:"Quicksand", "Be Vietnam Pro", sans-serif; font-weight:700; letter-spacing:-.01em; }

  /* Cảnh 1 */
  #s1 { justify-content:center; }
  #s1 .small { display:inline-block; color:var(--cream); animation:ring 1.6s ease-in-out infinite; }
  @keyframes ring { 0%, 50%, 100% { transform:none; } 5%, 15%, 25%, 35% { transform:rotate(-5deg) translateX(-2px); } 10%, 20%, 30%, 40% { transform:rotate(5deg) translateX(2px); } }
  .line { margin:0 0 30px; font-size:clamp(16px, 4vw, 20px); letter-spacing:.04em; text-shadow:0 0 10px var(--bg), 0 0 18px var(--bg), 0 0 26px var(--bg); }
  #s1 h1 { margin:14px 0 10px;font-size:clamp(40px, 10vw, 84px); line-height:1.05; text-shadow:0 0 40px rgba(255,77,109,.45); }
  .start { background:none; border:1px solid rgba(243,234,217,.5); border-radius:999px; padding:13px 30px; letter-spacing:.14em; text-transform:uppercase; font-size:13px;
    transition:background .3s, color .3s, box-shadow .3s; animation:glow 2.4s ease-in-out infinite; }
  .start:hover { background:var(--cream); color:var(--bg); }
  @keyframes glow { 50% { box-shadow:0 0 28px rgba(255,77,109,.55); } }
  /* nút có máy bay giấy: bấm là máy bay vút đi, cảnh sau chữ bay tới */
  .start { display:inline-flex; align-items:center; gap:10px; }
  .start .plane { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translate(2px, -3px) rotate(-6deg); } }
  /* bấm: nút lún xuống, bừng hồng, gợn sóng loang ra, chữ giãn tan; máy bay giấy thật (vẽ trên canvas) cất cánh kéo vệt lấp lánh */
  .start { position:relative; overflow:hidden; }
  .start.go { animation:goBtn 1s cubic-bezier(.3,.7,.3,1) forwards; pointer-events:none; }
  @keyframes goBtn {
    0% { transform:scale(1); }
    14% { transform:scale(.93); background:rgba(255,77,109,.28); border-color:#ff9ab5; box-shadow:0 0 26px rgba(255,77,109,.7), inset 0 0 18px rgba(255,180,205,.45); }
    40% { transform:scale(1.05); background:rgba(255,77,109,.18); border-color:#ffc2d4; box-shadow:0 0 60px rgba(255,77,109,.85), inset 0 0 22px rgba(255,200,220,.5); }
    100% { transform:scale(1.25); opacity:0; filter:blur(8px); border-color:#ffc2d4; box-shadow:0 0 90px rgba(255,77,109,0); } }
  .start.go .lbl { transition:opacity .55s .1s, letter-spacing .7s cubic-bezier(.2,.8,.2,1), filter .55s .1s; opacity:0; letter-spacing:.6em; filter:blur(4px); }
  .start.go .plane { visibility:hidden; }
  .start .rip { position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,235,242,.95), rgba(255,120,160,.55) 45%, rgba(255,77,109,0) 70%); animation:rip .75s ease-out forwards; }
  @keyframes rip { from { transform:scale(0); opacity:1; } to { transform:scale(22); opacity:0; } }
  #sm.active > * { animation:flyIn 1.1s cubic-bezier(.2,1.1,.3,1) both; animation-delay:calc(.35s + var(--k, 0) * .16s); }
  #sm.active > .hint { animation:flyIn 1.1s cubic-bezier(.2,1.1,.3,1) both, hint 2.4s ease-in-out 2.4s infinite; animation-delay:calc(.35s + var(--k, 0) * .16s), 2.4s; }
  #sm > :nth-child(2) { --k:1; } #sm > :nth-child(3) { --k:2; } #sm > :nth-child(4) { --k:3; } #sm > :nth-child(5) { --k:4; }
  @keyframes flyIn { from { opacity:0; transform:translate(-60vw, 40vh) rotate(-24deg) scale(.35); filter:blur(8px); } 70% { filter:none; } to { opacity:1; transform:none; filter:none; } }

  /* Cảnh tin nhắn đầu tiên + bộ đếm */
  #sm { justify-content:center; gap:18px; cursor:pointer; }
  .verdict { margin:0; font:700 clamp(28px, 7.6vw, 46px)/1.2 "Quicksand", "Be Vietnam Pro", sans-serif; color:var(--cream); text-shadow:var(--glow); }
  #sm img { width:min(86vw, 400px, 44vh); height:auto; border-radius:22px;
    box-shadow:0 0 0 1px rgba(243,234,217,.2), 0 20px 60px rgba(0,0,0,.6), 0 0 50px rgba(255,77,109,.28); }
  .count { display:flex; gap:clamp(12px, 4vw, 26px); }
  .count div { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .count b { font-family:"Quicksand", sans-serif; font-weight:700; font-size:clamp(30px, 8.5vw, 52px); line-height:1; font-variant-numeric:tabular-nums;
    color:var(--cream); text-shadow:var(--glow); }
  .count span { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  #sm .small { color:#ffc2d6; } #sm .hint { font-family:"Quicksand", "Be Vietnam Pro", sans-serif; font-weight:700; font-size:clamp(18px, 5.2vw, 24px); letter-spacing:.14em; opacity:.55; animation:hint 2.4s ease-in-out infinite; }
  @keyframes hint { 50% { opacity:.2; } }

  /* Câu đố ngày nhắn tin đầu tiên */
  #sq { justify-content:center; gap:26px; }
  #si { justify-content:center; cursor:pointer; }
  #si .ask.big { font-size:clamp(64px, 20vw, 120px); }
  .ask { margin:0; max-width:640px; font:700 clamp(30px, 8.2vw, 50px)/1.3 "Quicksand", "Be Vietnam Pro", sans-serif; text-wrap:balance; }
  /* chọn ngày kiểu bánh xe cuộn, thay cho ô date mặc định của trình duyệt */
  .dpick { position:relative; display:flex; gap:4px; padding:0 12px; border-radius:28px; background:rgba(255,255,255,.045);
    border:1px solid rgba(255,143,180,.4); box-shadow:0 0 30px rgba(255,77,140,.2), inset 0 0 24px rgba(255,77,140,.08); }
  .dpick::before { content:""; position:absolute; left:8px; right:8px; top:50%; height:48px; margin-top:-24px; border-radius:16px; pointer-events:none;
    background:linear-gradient(90deg, rgba(255,77,140,.14), rgba(255,143,180,.24), rgba(255,77,140,.14)); border:1px solid rgba(255,143,180,.4); box-shadow:0 0 18px rgba(255,77,140,.3); }
  .wheel { position:relative; height:240px; overflow:hidden; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
    -webkit-mask-image:linear-gradient(transparent, #000 36%, #000 64%, transparent); mask-image:linear-gradient(transparent, #000 36%, #000 64%, transparent); }
  .wheel { perspective:420px; }
  .wheel:active { cursor:grabbing; }
  .wheel[data-k="d"] { width:64px; } .wheel[data-k="m"] { width:112px; } .wheel[data-k="y"] { width:86px; }
  .wheel .track { position:absolute; transform-style:preserve-3d; left:0; right:0; top:96px; will-change:transform; }
  /* căn giữa theo nét chữ thật (cap → chân chữ) chứ không theo khung font, để số nằm đúng giữa thanh hồng trên mọi máy */
  .wheel .track div { position:absolute; left:0; right:0; top:0; height:48px; display:flex; align-items:center; justify-content:center; white-space:nowrap; font:700 22px "Quicksand", "Be Vietnam Pro", sans-serif;
    color:var(--cream); opacity:.4; }
  .wheel .track span { display:block; padding:16px 12px; margin:-16px -12px; line-height:1; text-box:trim-both cap alphabetic; }
  .wheel .track div.on { text-shadow:var(--glow); }
  .pick { border:0; border-radius:999px; padding:13px 40px; background:var(--accent); color:#fff; font:700 18px "Quicksand", sans-serif; letter-spacing:.06em;
    box-shadow:0 8px 34px rgba(255,77,109,.55); transition:opacity .4s, transform .4s; }
  .pick:disabled { background:rgba(255,77,109,.28); color:rgba(255,255,255,.5); box-shadow:none; cursor:default; }   /* không dùng opacity: hiệu ứng bay vào ghi đè */
  #sq.active > * { animation:flyIn 1.1s cubic-bezier(.2,1.1,.3,1) both; animation-delay:calc(.35s + var(--k, 0) * .16s); }
  #sq > :nth-child(2) { --k:1; } #sq > :nth-child(3) { --k:2; }
  /* 1...2...3... */
  #sc { justify-content:center; }
  .cnt { margin:0; font:700 clamp(46px, 14vw, 90px)/1 "Quicksand", sans-serif; color:var(--cream); text-shadow:var(--glow); }
  .cnt span { display:inline-block; padding:.4em; margin:-.4em; opacity:0; animation:pop .7s cubic-bezier(.3,1.7,.5,1) forwards; animation-delay:calc(.7s + var(--n) * 1s); }
  @keyframes pop { from { opacity:0; transform:scale(2.4); filter:blur(10px); } to { opacity:1; transform:none; filter:none; } }
  /* gợi ý chạm để sang trang */
  #tap { position:fixed; left:0; right:0; bottom:3.5vh; z-index:5; text-align:center; pointer-events:none; opacity:0; transition:opacity .8s;
    font:700 clamp(15px, 4.2vw, 19px) "Quicksand", "Be Vietnam Pro", sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#ffc2d6; }
  #tap.on { opacity:.55; animation:hint 2.4s ease-in-out 1s infinite; }

  /* Cảnh 2: phụ đề dưới đám hạt */
  #s2 { justify-content:flex-end; padding-bottom:11vh; cursor:pointer; }
  #s2.mid { justify-content:center; padding-bottom:0; }
  #s2.mid .sub { font-size:clamp(38px, 11vw, 68px); line-height:1.25; text-wrap:balance; }
  #s2.mid .sub.letter { width:min(600px, 100%); max-width:600px; min-height:0; text-align:left; font-size:clamp(20px, 5.6vw, 30px); line-height:1.55; text-wrap:pretty; }
  .sub.letter .ch { animation:chIn .9s cubic-bezier(.2,1.5,.4,1) forwards, chHue 3.6s linear infinite; animation-delay:calc(.5s + var(--i) * 14ms), calc(var(--i) * -.12s); }
  .sub.big { font-family:"Quicksand", sans-serif; font-weight:700; font-size:clamp(46px, 13vw, 84px); line-height:1.15; }
  .sub { min-height:3.2em; max-width:720px; margin:0; font-family:"Quicksand", sans-serif; font-weight:700; font-size:clamp(30px, 8.6vw, 50px); line-height:1.3; }
  /* chữ thật vẫn nằm đó để giữ bố cục, nhưng trong suốt: thứ mắt thấy là hạt vẽ trên #ptx */
  .w { display:inline-block; white-space:nowrap; }
  .nw { white-space:nowrap; display:inline-block; }
  /* phụ đề: từng chữ cái rơi xuống xoay nhẹ rồi bật vào chỗ, sau đó cả dòng nhấp nhô như sóng và đổi màu lấp lánh chạy dọc */
  .w { display:inline-block; white-space:nowrap; }
  /* chữ bay: để từ ở dạng inline (vẫn không ngắt giữa từ) — Safari tính sai bề ngang inline-block khi chữ bên trong có margin âm, làm cả đoạn lệch sang phải */
  #sub .w, #qask .w, #intro .w { display:inline; }
  .ch { display:inline-block; opacity:0; color:var(--cream); transform:translateY(-.9em) scale(1.8) rotate(-14deg); filter:blur(10px);
    animation:chIn .9s cubic-bezier(.2,1.5,.4,1) forwards, chWave 2.8s ease-in-out infinite, chHue 3.6s linear infinite;
    animation-delay:calc(.9s + var(--i) * 55ms), calc(2.4s + var(--i) * 90ms), calc(var(--i) * -.12s);
    padding:.5em .45em; margin:-.5em -.45em; }   /* iPhone cắt quầng sáng theo khung của chữ đang chạy hiệu ứng: nới khung ra cho đủ chỗ, margin âm để không lệch chữ */
  @keyframes chIn { 60% { opacity:1; filter:blur(0); } to { opacity:1; transform:none; filter:none; } }
  @keyframes chWave { 0%, 100% { translate:0 0; } 50% { translate:0 -.16em; } }
  @keyframes chHue {
    0%, 100% { color:var(--cream); text-shadow:0 0 8px rgba(255,214,230,.35); }
    33% { color:#ff8fb4; text-shadow:0 0 14px rgba(255,77,140,.85), 0 0 30px rgba(255,77,140,.4); }
    66% { color:#ffc2d6; text-shadow:0 0 12px rgba(255,77,140,.6), 0 0 26px rgba(255,77,140,.25); } }
  .sub { transition:opacity .6s, filter .6s; }
  .sub.bye { opacity:0; filter:blur(8px); }
  #s3 h1, #omg { transition:color .9s ease, text-shadow .9s ease; }
  .ghost, .ghost * { color:transparent !important; text-shadow:none !important; transition:none !important; }   /* tắt ngay, không mờ dần lộ chữ cũ */
  #ptx { position:fixed; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; }
  #omg { position:fixed; left:0; right:0; bottom:16vh; margin:0; padding:0 24px; text-align:center; pointer-events:none; visibility:hidden;
    font:700 clamp(40px, 11vw, 76px)/1.1 "Quicksand", sans-serif; color:var(--cream); text-shadow:var(--glow); }
  #omg small { display:block; font-size:.62em; }

  /* Cảnh 3: câu hỏi, đặt dưới trái tim */
  #s3 { justify-content:flex-end; padding-bottom:8vh; }
  #s3 h1 { margin:0 0 10px; font-size:clamp(42px, 11.5vw, 76px); line-height:1.1; text-shadow:0 2px 30px rgba(7,6,11,.9), var(--glow); text-wrap:balance; }
  .answers { display:flex; gap:14px; align-items:center; justify-content:center; min-height:76px; margin-top:10px; }
  .btn { font-weight:500; border:0; border-radius:999px; padding:13px 34px; opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .6s, transform .6s, background .2s, scale .4s cubic-bezier(.34,1.8,.64,1); }
  .btn.show { opacity:1; transform:none; pointer-events:auto; }
  #yes { background:var(--accent); color:#fff; scale:var(--g, 1); box-shadow:0 8px 34px rgba(255,77,109,.55); }
  #yes:hover { background:#ff6f8a; }
  #no { background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(243,234,217,.6); }
  .gap-no { flex:none; height:1px; transition:width 1.4s cubic-bezier(.45,0,.25,1); }   /* chỗ trống nút No để lại, khép từ từ */
  #no.run { position:fixed; z-index:7; background:#17131c; transition:left .28s cubic-bezier(.34,1.4,.64,1), top .28s cubic-bezier(.34,1.4,.64,1), rotate .28s; }

  body:not(.ready) #start { visibility:hidden; }

  /* núi meme sau khi bấm Yes */
  #memes { position:fixed; inset:-24px; z-index:4; overflow:hidden; pointer-events:none; }
  #memes > img { translate:calc(var(--lx, 0) * -14px) calc(var(--ly, 0) * -14px); }   /* nghiêng máy: tường lệch ngược, ảnh và chữ lệch xuôi */
  #memes > img { position:absolute; object-fit:cover; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.5); will-change:transform, opacity;
    opacity:0; transform:translate(var(--dx, 0), var(--dy, 0)) scale(.06) rotate(var(--r0)); filter:brightness(1.8);
    transition:transform 1.5s cubic-bezier(.16,.9,.3,1.06), opacity .5s ease, filter 1.5s ease; }
  #memes > img.hero { left:50%; top:50%; width:min(72vw, 48vh, 380px); aspect-ratio:2/3; margin:0; translate:calc(-50% + var(--lx, 0) * 26px) calc(-50% + var(--ly, 0) * 26px); z-index:2; border-radius:28px;
    box-shadow:0 0 0 4px rgba(255,255,255,.9), 0 24px 70px rgba(0,0,0,.7), 0 0 60px rgba(255,77,109,.45);
    transition:transform 2.6s cubic-bezier(.16,.84,.3,1), opacity 1.8s ease, filter 2.6s ease; }
  #memes > img.hero.up { transform:translate(0, 0) scale(1) rotate(-2deg); }
  #memes .cap { position:absolute; left:50%; top:calc(50% + min(72vw, 48vh, 380px) * .75 + 10px); translate:calc(-50% + var(--lx, 0) * 38px) calc(var(--ly, 0) * 38px); z-index:3; white-space:nowrap;
    font-family:"Quicksand", "Be Vietnam Pro", sans-serif; font-weight:700; font-size:clamp(28px, 8vw, 46px); color:var(--cream); text-shadow:var(--glow); padding:4px 26px 8px; border-radius:999px;
    background:rgba(7,6,11,.72); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); box-shadow:0 0 0 1.5px rgba(255,143,180,.75), 0 0 26px rgba(255,77,140,.35), 0 12px 34px rgba(0,0,0,.55);
    opacity:0; transform:translateY(24px) scale(.6) rotate(-3deg); transition:transform .9s cubic-bezier(.3,1.6,.5,1), opacity .6s ease; }
  #memes .cap.up { opacity:1; transform:rotate(-3deg); }
  #memes .cap { pointer-events:auto; cursor:pointer; touch-action:manipulation; }
  #fx { position:fixed; inset:0; width:100%; height:100%; z-index:6; pointer-events:none; }
  #memes > img.up { opacity:1; transform:translate(0, 0) scale(1.1) rotate(var(--r)); filter:none; }


  /* đĩa nhạc */
  .player { position:fixed; left:50%; bottom:14px; translate:-50% 0; z-index:5; display:flex; align-items:center; gap:14px; padding:6px 22px 6px 6px;
    background:rgba(255,255,255,.07); backdrop-filter:blur(10px); border-radius:999px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); max-width:calc(100vw - 24px); }
  .disc { position:relative; width:76px; height:76px; flex:none; padding:0; border:0; background:none; }
  .vinyl { position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:repeating-radial-gradient(circle, #101114 0 2px, #25272d 2px 3px); box-shadow:0 4px 14px rgba(0,0,0,.6), inset 0 0 0 1px #000;
    animation:spin 3.2s linear infinite; animation-play-state:paused; }
  .vinyl::before { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 20deg, transparent 0 40deg, rgba(255,255,255,.18) 60deg, transparent 80deg 220deg, rgba(255,255,255,.13) 240deg, transparent 260deg); }
  .vinyl::after { content:""; position:absolute; width:7px; height:7px; border-radius:50%; background:var(--cream); box-shadow:0 0 0 1px rgba(0,0,0,.5); }
  .vinyl img { width:44%; height:44%; border-radius:50%; object-fit:cover; background:var(--accent); }
  .playing .vinyl { animation-play-state:running; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .arm { position:absolute; right:-4px; top:-4px; width:5px; height:44px; border-radius:3px; background:linear-gradient(#e6dfd0, #9a927f); transform-origin:50% 5px; transform:rotate(-12deg);
    transition:transform .7s cubic-bezier(.34,1.3,.64,1); box-shadow:0 2px 4px rgba(0,0,0,.5); }
  .arm::before { content:""; position:absolute; left:-4px; top:-2px; width:13px; height:13px; border-radius:50%; background:#8d8573; }
  .arm::after { content:""; position:absolute; left:-2px; bottom:-3px; width:9px; height:12px; border-radius:2px; background:var(--accent); }
  .playing .arm { transform:rotate(24deg); }
  .track { display:flex; flex-direction:column; min-width:0; text-align:left; font-size:13px; line-height:1.35; }
  .track b { font-weight:500; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track span { color:var(--dim); }
  /* đĩa nhạc thu nhỏ, nằm ở góc trên phải */
  .player { left:auto; bottom:auto; right:14px; top:14px; translate:none; flex-direction:row-reverse; gap:10px; padding:0; background:none; backdrop-filter:none; box-shadow:none; }
  .disc { width:44px; height:44px; }
  .vinyl::after { width:4px; height:4px; }
  .arm { right:-3px; top:-3px; width:3px; height:26px; transform-origin:50% 3px; }
  .arm::before { left:-3px; top:-2px; width:9px; height:9px; }

/* ---------- Chữ bằng hạt: lấy mẫu từng ký tự đúng chỗ của chữ thật, hạt bay về xếp thành chữ, lấp lánh như trái tim ---------- */

function samplePts(el) {

    const m = g.measureText("Hg"), asc = m.fontBoundingBoxAscent || fs * .8, desc = m.fontBoundingBoxDescent || fs * .2;

function ptOut(el) { const now = performance.now() / 1000; el.classList.add("ghost"); ptGroups.forEach(G => { if (G.el === el && !G.out) G.out = now; }); }

    const dim = G.out ? 1 : 1 - Math.min(1, Math.max(0, (lt - G.rev) / .9)) * .8;   // hạt mờ dần thành lớp lấp lánh

function launch(e) {

  rip.style.left = ((e && e.clientX ? e.clientX : br.left + br.width / 2) - br.left) + "px"; rip.style.top = ((e && e.clientY ? e.clientY : br.top + br.height / 2) - br.top) + "px";

  const now = performance.now() / 1000, W = innerWidth, H = innerHeight, x = pr.left + pr.width / 2, y = pr.top + pr.height / 2;
  // lao ra một đoạn, nhào lộn đúng một vòng tròn gọn, rồi tăng tốc vút thẳng ra khỏi màn

    if (q < L1) return [x + Math.cos(h) * q, y + Math.sin(h) * q];

    const a = Math.random() * 6.2832, ex = br.left + br.width / 2 + Math.cos(a) * br.width / 2, ey = br.top + br.height / 2 + Math.sin(a) * br.height / 2;

}

const qpick = (() => {
  const ROW = 48, yNow = new Date().getFullYear(), cols = {}, pad = n => String(n).padStart(2, "0");
  const items = { d: [...Array(31)].map((_, i) => [i + 1, pad(i + 1)]), m: [...Array(12)].map((_, i) => [i + 1, "tháng " + (i + 1)]),
    y: [...Array(7)].map((_, i) => [yNow - 6 + i, String(yNow - 6 + i)]) };
  const start = { d: 1, m: 1, y: yNow };
  document.querySelectorAll("#qdate .wheel").forEach(w => {
    const k = w.dataset.k, list = items[k], track = document.createElement("div"); track.className = "track";
    const cells = list.map(([, label]) => { const d = document.createElement("div"), t = document.createElement("span"); t.textContent = label; d.append(t); track.append(d); return d; });
    w.append(track);
    const n = list.length, at = p => ((Math.round(p) % n) + n) % n;   // cuộn vòng: hết cuối thì quay lại đầu
    let pos = list.findIndex(([v]) => v === start[k]), anim = 0, drag = null;
    const draw = () => {          // vị trí tính theo số ô (có thể lẻ); ô càng xa giữa càng nhỏ, mờ và nghiêng như bánh xe
      cells.forEach((c, i) => {
        const o = ((i - pos) % n + n * 1.5) % n - n / 2, d = Math.min(3, Math.abs(o));   // khoảng cách tới ô giữa, đi đường vòng ngắn nhất
        c.style.visibility = Math.abs(o) > 3 ? "hidden" : "";
        c.style.opacity = 1 - d * .28; c.style.transform = `translateY(${o * ROW}px) scale(${1.14 - d * .12}) rotateX(${o * -18}deg)`; c.classList.toggle("on", d < .5); });
    };
    const go = to => {            // trôi mượt về đúng một ô
      cancelAnimationFrame(anim); to = Math.round(to);
      const from = pos, t0 = performance.now(), dur = 220 + Math.min(600, Math.abs(to - from) * 90);
      const step = now => { const u = Math.min(1, (now - t0) / dur); pos = from + (to - from) * (1 - Math.pow(1 - u, 3)); draw(); if (u < 1) anim = requestAnimationFrame(step); };

    });

      drag.v = .8 * ((drag.ly - e.clientY) / ROW / dt) + .2 * drag.v; drag.t = now; drag.ly = e.clientY;   // ô / ms

      }
      go(pos + (performance.now() - d.t > 80 ? 0 : Math.max(-6, Math.min(6, d.v * 160))));            // vuốt nhanh thì trôi thêm vài ô theo đà
    };

    no.classList.add("run"); no.getBoundingClientRect();

    const x0 = W * (.1 + Math.random() * .8), x1 = x0 + rnd(W * .35);
    flyers.push({ k: "heart", t0: now, dur: 3.4 + Math.random() * 1.6, s: 36 + Math.random() * 30, ph: Math.random() * 6, tilt: rnd(.3),
      p: [[x0, H + 60], [x0 + rnd(W * .5), H * .66], [x1 + rnd(W * .5), H * .33], [x1, -80]] });
  } else {
    const L = Math.random() < .5, y0 = H * (.3 + Math.random() * .6), y1 = H * (.05 + Math.random() * .5);
    flyers.push({ k: "plane", t0: now, dur: 2.8 + Math.random() * 1.2, s: 50 + Math.random() * 24,
      p: [[L ? -80 : W + 80, y0], [W * (L ? .35 : .65), y0 - H * (.25 + Math.random() * .3)], [W * (L ? .6 : .4), y1 + H * (.25 + Math.random() * .3)], [L ? W + 80 : -80, y1]] });
  }
}
function burst(x, y) {           // pháo hoa bụi sáng nhỏ: toả tròn ra rồi rơi nhẹ, tắt dần
  const now = performance.now() / 1000;
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * 6.2832, v = 40 + Math.pow(Math.random(), .6) * 220;
    glints.push({ x, y, t: now, life: .9 + Math.random() * 1.1, r: 1.2 + Math.random() * 2.6, c: Math.floor(Math.random() * dotSprites.length),
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30 });
  }
}
function drawFx(nowMs) {
  const t = nowMs / 1000;
  fg.setTransform(ptDpr, 0, 0, ptDpr, 0, 0); fg.clearRect(0, 0, innerWidth, innerHeight);
  if (!flyers.length && !glints.length) return;
  glints = glints.filter(q => t - q.t < q.life);
  for (const q of glints) {         // bụi lấp lánh rơi lại phía sau
    const a = (t - q.t) / q.life, r = q.r * (1 - a * .5), dt = t - q.t;
    fg.globalAlpha = (1 - a) * .95; fg.drawImage(dotSprites[q.c], q.x + q.vx * (1 - Math.exp(-3 * dt)) / 3 - r * 1.6, q.y + q.vy * (1 - Math.exp(-3 * dt)) / 3 + 40 * dt * dt - r * 1.6, r * 3.2, r * 3.2);
  }
  fg.globalAlpha = 1;
  flyers = flyers.filter(f => t - f.t0 < f.dur);
  for (const f of flyers) {
    const u = (t - f.t0) / f.dur, P = f.fn || (v => bez(f.p, v)), [x, y] = P(u), [x2, y2] = P(Math.min(1, u + .01));
    fg.save(); fg.translate(x, y);
    if (f.k === "heart") {
      const beat = 1 + Math.pow(Math.max(0, Math.sin(t * 6 + f.ph)), 8) * .16, k = f.s / 64 * beat;
      fg.rotate(f.tilt + Math.sin(t * 2.2 + f.ph) * .2); fg.scale(k, k); fg.translate(-32, -30);
      const gr = fg.createRadialGradient(22, 18, 2, 32, 30, 42);
      gr.addColorStop(0, "#ffe0ea"); gr.addColorStop(.4, "#ff7aa5"); gr.addColorStop(1, "#d6336c");
      fg.shadowColor = "rgba(255,90,150,.9)"; fg.shadowBlur = 24 * k; fg.fillStyle = gr; fg.fill(HEART);
      fg.shadowBlur = 0; fg.strokeStyle = "rgba(255,255,255,.55)"; fg.lineWidth = 1.5; fg.stroke(HEART);
      fg.fillStyle = "rgba(255,255,255,.8)"; fg.beginPath(); fg.ellipse(17, 16, 6.5, 3.4, -.65, 0, 6.283); fg.fill();
      fg.beginPath(); fg.arc(26.5, 11.5, 1.8, 0, 6.283); fg.fill();
    } else {
      const k = f.s / 64;
      fg.rotate(Math.atan2(y2 - y, x2 - x) + Math.PI / 4); fg.scale(k, k * (.88 + .12 * Math.sin(t * 5 + f.t0))); fg.translate(-32, -32);   // chao cánh nhẹ
      fg.shadowColor = "rgba(255,130,180,.8)"; fg.shadowBlur = 18 * k;
      fg.fillStyle = "#ffffff"; fg.fill(PLANE[0]); fg.shadowBlur = 0;
      fg.fillStyle = "#ffe4ee"; fg.fill(PLANE[1]);
      fg.fillStyle = "#ffb3cb"; fg.fill(PLANE[2]);
      fg.strokeStyle = "rgba(214,51,108,.55)"; fg.lineWidth = 1.4; fg.lineJoin = "round";
      PLANE.forEach(P => fg.stroke(P));
    }
    fg.restore();
  }
}

function memeWall() {              // ảnh từ sâu trong nền nổi dần lên, phủ kín cả màn hình
  const W = innerWidth + 48, H = innerHeight + 48, cell = Math.max(96, Math.min(170, innerWidth / 4));
  const nx = Math.ceil(W / cell), ny = Math.ceil(H / cell), w = W / nx, h = H / ny, total = nx * ny;
  const cells = [...Array(total).keys()].sort(() => Math.random() - .5), pics = [...Array(CONFIG.memes).keys()].sort(() => Math.random() - .5);
  let n = 0;
  const timer = setInterval(() => {
    if (n >= total) {
      clearInterval(timer);
      if (CONFIG.photo) setTimeout(() => {           // tường meme kín rồi thì ảnh chị nổi lên chính giữa
        const hero = new Image(); hero.className = "hero"; hero.alt = "";
        hero.style.setProperty("--r0", "-30deg");
        hero.style.setProperty("--dx", secretXY[0] - innerWidth / 2 + "px"); hero.style.setProperty("--dy", secretXY[1] - innerHeight / 2 + "px");
        hero.onload = () => { $("memes").append(hero); hero.getBoundingClientRect(); hero.classList.add("up");
          if (CONFIG.caption) setTimeout(() => {
            const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = CONFIG.caption;
            cap.addEventListener("click", () => {   // mỗi lần bấm bay ra 1-2 cái
              cap.animate([{ scale: 1 }, { scale: 1.18 }, { scale: 1 }], { duration: 260 });
              fly(); if (Math.random() < .5) setTimeout(fly, 180);
            });
            $("memes").append(cap); cap.getBoundingClientRect(); cap.classList.add("up");
          }, 2200);
        };
        hero.src = CONFIG.photo;
      }, 900);
      return;
    }
    const c = cells[n], img = new Image();
    img.src = memeSrc(pics[n % pics.length]); img.alt = "";
    Object.assign(img.style, { width: 100 / nx + "%", height: 100 / ny + "%", left: (c % nx) * 100 / nx + "%", top: Math.floor(c / nx) * 100 / ny + "%" });
    img.style.setProperty("--r0", rnd(200) + "deg"); img.style.setProperty("--r", rnd(5) + "deg");
    img.style.setProperty("--dx", secretXY[0] + 24 - ((c % nx) + .5) * w + "px"); img.style.setProperty("--dy", secretXY[1] + 24 - (Math.floor(c / nx) + .5) * h + "px");
    $("memes").append(img);
    img.getBoundingClientRect();
    img.classList.add("up");
    n++;
  }, Math.max(28, 2600 / total));
}

$("yes").addEventListener("click", e => {
  if (performance.now() - lastDodge < 700) { e.preventDefault(); return; }   // vừa bấm No xong thì chạm nhầm vào Yes không tính
  $("no").style.display = "none";
  ptOut($("headline")); show("");                 // câu hỏi tan thành bụi
  glowT = 1; flinch = .2;   // cả trái tim bừng sáng
  $("omg").style.visibility = "visible"; ptext($("omg"), secretXY.slice());   // OMG she said YES: hạt phụt ra từ tim rồi xếp thành chữ
  setTimeout(() => { sealBreak = performance.now(); }, 2600);     // phong ấn quay nhanh dần, trắng loá rồi vỡ
  setTimeout(() => { burstStart = performance.now(); flinch = .25; glowT = 0; ptOut($("omg")); memeWall(); }, 3250);   // trái tim nổ tung, meme phụt ra
  setTimeout(() => sealOn = false, 4100);
});
