services:
  web:                        # bản chính hiện tại: phong thư dấu sáp (index.html gốc, GitHub Pages cũng lấy bản này)
    build: .
    image: hoanganh-letter
    container_name: hoanganh-letter
    ports:
      - "8123:80"
    restart: unless-stopped   # Docker bật lên là trang tự chạy lại

  v1:                         # bản cũ (v1/index.html)
    build:
      context: .
      args:
        PAGE: v1/index.html
    image: hoanganh-web
    container_name: hoanganh
    ports:
      - "8124:80"
    restart: unless-stopped

  tunnel:                     # cloudflared: đưa trang chính ra hoanganh.qhuy204.id.vn, tự chạy lại cùng Docker
    image: cloudflare/cloudflared:2024.12.2
    container_name: hoanganh-tunnel
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${USERPROFILE}/.cloudflared/f356703b-d597-4cac-a0f3-8b5915575445.json:/etc/cloudflared/creds.json:ro   # credentials ở ngoài repo
    depends_on:
      - web
    restart: unless-stopped
